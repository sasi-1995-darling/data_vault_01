name: Skill & Agent Sync Check

on:
  pull_request:
    paths:
      - ".github/skills/**"
      - ".github/agents/**"
      - ".github/workflows/skill-sync-check.yaml"
      - ".claude/skills/dv-code-implementer/**"
      - ".claude/skills/dv-tech-design-creator/**"
      - ".claude/skills/v-psa-stg-generator/**"
      - ".claude/skills/dv-raw-vault-generator/**"
      - ".claude/skills/conventional-commit/**"
      - ".claude/skills/dv-code-reviewer/**"
      - ".claude/skills/dv-pipeline-handoff/**"
      - ".claude/skills/dv-modeling-advisor/**"

jobs:
  check-sync:
    name: Verify skills and agents are in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compare FBIN skill directories
        run: |
          echo "Comparing .github/skills/ (canonical) ↔ .claude/skills/ (mirror)..."
          echo ""

          # Only compare FBIN custom skills (not dbt-labs plugin skills in .claude/skills/)
          SKILLS=("dv-code-implementer" "dv-tech-design-creator" "v-psa-stg-generator" "dv-raw-vault-generator" "conventional-commit" "dv-code-reviewer" "dv-pipeline-handoff" "dv-modeling-advisor")
          DRIFT_FOUND=false

          for skill in "${SKILLS[@]}"; do
            if [ ! -d ".claude/skills/$skill" ]; then
              echo "ERROR: .claude/skills/$skill/ does not exist (mirror missing)"
              DRIFT_FOUND=true
              continue
            fi

            DIFF_OUTPUT=$(diff -rq ".github/skills/$skill" ".claude/skills/$skill" --exclude='.DS_Store' --exclude='__pycache__' 2>&1)
            if [ -n "$DIFF_OUTPUT" ]; then
              echo "DRIFT in $skill:"
              echo "$DIFF_OUTPUT"
              echo ""
              DRIFT_FOUND=true
            else
              echo "OK: $skill is in sync"
            fi

            # Verify file counts match (catches missing files that diff -rq might miss)
            CANONICAL_COUNT=$(find ".github/skills/$skill" -type f ! -name '.DS_Store' ! -path '*/__pycache__/*' | wc -l | tr -d ' ')
            MIRROR_COUNT=$(find ".claude/skills/$skill" -type f ! -name '.DS_Store' ! -path '*/__pycache__/*' | wc -l | tr -d ' ')
            if [ "$CANONICAL_COUNT" != "$MIRROR_COUNT" ]; then
              echo "DRIFT in $skill: file count mismatch (canonical=$CANONICAL_COUNT, mirror=$MIRROR_COUNT)"
              DRIFT_FOUND=true
            fi
          done

          echo ""
          if [ "$DRIFT_FOUND" = true ]; then
            echo "=================================================="
            echo "FAIL: Skills are out of sync."
            echo ""
            echo "  .github/skills/ is the CANONICAL source."
            echo "  Run:  bash scripts/sync_skills.sh && git add .claude/skills/ && git commit --amend"
            echo "=================================================="
            exit 1
          else
            echo "PASS: All FBIN skills are in sync."
          fi

      - name: Verify Copilot agents exist
        run: |
          # Architectural decision (see AGENTS.md): agent files live ONLY
          # in .github/agents/. They are NOT mirrored to .claude/agents/
          # because VS Code Copilot discovers agent frontmatter in any
          # .md file and would surface duplicates in the agent picker.
          # Historical .claude/agents/ tree was removed in PR #1715
          # (commit 8c11b833). This check enforces the canonical layout:
          # one source of truth, no mirror.
          echo "Checking .github/agents/ for Copilot-format agent files..."
          echo ""

          AGENTS=("dv-pipeline-coordinator" "dv-source-analyzer" "dv-model-generator" "dv-validator" "dv-knowledge-advisor")
          MISSING=false

          for agent in "${AGENTS[@]}"; do
            if [ ! -f ".github/agents/$agent.agent.md" ]; then
              echo "MISSING: .github/agents/$agent.agent.md"
              MISSING=true
            else
              echo "OK: $agent.agent.md"
            fi
          done

          echo ""

          # Negative-evidence guard: catch accidental re-introduction of
          # .claude/agents/ mirror (would cause Copilot picker duplicates).
          # A tombstone README.md is allowed (and expected — explains the
          # architectural decision to future contributors); any other .md
          # file in this directory is a mirror violation.
          if [ -d ".claude/agents" ]; then
            STRAY=$(find .claude/agents -type f -name '*.md' ! -name 'README.md' 2>/dev/null)
            if [ -n "$STRAY" ]; then
              echo ""
              echo "=================================================="
              echo "FAIL: .claude/agents/ contains agent file(s):"
              echo "$STRAY"
              echo ""
              echo "  Per AGENTS.md, agent files live ONLY in .github/agents/."
              echo "  VS Code Copilot would surface duplicates if mirrored."
              echo "  Remove the file(s) above and commit. The tombstone"
              echo "  .claude/agents/README.md may remain."
              echo "=================================================="
              exit 1
            fi
          fi

          echo ""
          if [ "$MISSING" = true ]; then
            echo "=================================================="
            echo "FAIL: Copilot agent files missing in .github/agents/."
            echo "=================================================="
            exit 1
          else
            echo "PASS: All Copilot agent files present; no .claude/agents/ mirror."
          fi
