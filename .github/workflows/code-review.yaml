name: Automated Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - "models/**"
      - "tests/**"
      - "macros/**"
      - "scripts/automation/src/**"
      - "scripts/automation/.code_review_ignore"
      - ".github/workflows/code-review.yaml"

# ── Concurrency ─────────────────────────────────────────────────────────
# Cancel in-progress review when new commits are pushed to the same PR.
# ────────────────────────────────────────────────────────────────────────
concurrency:
  group: code-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  code-review:
    name: DV Code Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v5
        with:
          fetch-depth: 0 # Full history for git diff

      - name: Fetch base branch
        run: git fetch origin main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.11"

      - name: Install reviewer dependencies
        # The reviewer is pure-stdlib except for PyYAML, which the
        # governance-allowlist checks (I5 et al.) import to parse
        # governance_allowlist.yml. Without this, the import raises
        # ModuleNotFoundError on the bare runner and crashes the reviewer.
        # Kept minimal (mirrors scripts/automation/requirements.txt) so review
        # stays fast and network-light — the full requirements file pulls in
        # mcp/pydantic/sqlparse, none of which the reviewer needs.
        run: python3 -m pip install 'pyyaml>=6.0'

      - name: Get changed files
        id: changed
        run: |
          MERGE_BASE=$(git merge-base origin/main HEAD 2>/dev/null) || MERGE_BASE="origin/main"

          # Get changed .sql and .yml files in models/, tests/, macros/
          CHANGED_FILES=$(git diff --name-only --diff-filter=ACMR "$MERGE_BASE" HEAD -- \
            'models/**/*.sql' 'models/**/*.yml' 'tests/**/*.sql' 'macros/**/*.sql' \
            | tr '\n' ' ')

          echo "files=${CHANGED_FILES}" >> "$GITHUB_OUTPUT"

          if [ -z "$CHANGED_FILES" ]; then
            echo "No reviewable files changed"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Reviewing: ${CHANGED_FILES}"
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run code reviewer
        id: review
        if: steps.changed.outputs.skip == 'false'
        env:
          CHANGED_FILES: ${{ steps.changed.outputs.files }}
        run: |
          set +e
          python3 scripts/automation/src/code_reviewer.py \
            --files ${CHANGED_FILES} \
            --base-branch origin/main \
            --format markdown \
            > review_output.md 2>&1
          REVIEW_EXIT=$?
          set -e

          echo "exit_code=${REVIEW_EXIT}" >> "$GITHUB_OUTPUT"

          cat review_output.md

          # Truncate for PR comment (GitHub limit: 65536 chars)
          head -c 60000 review_output.md > review_comment.md

      - name: Post PR comment
        if: steps.changed.outputs.skip == 'false' && (steps.review.outputs.exit_code != '0' || steps.review.outcome == 'success')
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review_comment.md', 'utf8');

            // Find existing bot comment to update (avoid spam)
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- dv-code-review -->';
            const existing = comments.find(c => c.body.includes(marker));
            const commentBody = `${marker}\n${body}`;

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body: commentBody,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: commentBody,
              });
            }

      - name: Delete stale comment on clean pass
        if: steps.changed.outputs.skip == 'false' && steps.review.outputs.exit_code == '0'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const marker = '<!-- dv-code-review -->';
            const existing = comments.find(c => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.deleteComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
              });
            }

      - name: Set check status
        if: steps.changed.outputs.skip == 'false'
        run: |
          EXIT_CODE=${{ steps.review.outputs.exit_code }}
          if [ "$EXIT_CODE" = "1" ]; then
            echo "::error::Code review found FAIL-level findings. See PR comment for details."
            exit 1
          elif [ "$EXIT_CODE" = "2" ]; then
            echo "::error::Code review configuration error."
            exit 2
          fi
          echo "Code review passed — no FAIL findings."
