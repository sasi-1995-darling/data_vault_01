name: Credential Threat Model Gate

# =============================================================================
# What this workflow does
#
# Enforces that docs/triage-agent/credential-threat-model.md exists and
# contains the three checklist question markers (Q1/Q2/Q3) verbatim,
# whenever a PR touches Phase-2 deliverables.
#
# The gate is content-keyed, not existence-keyed: an empty doc, a stub doc,
# or a doc missing any of the three checklist markers all fail. Rationale:
# a doc-without-checklist is a doc nobody can consult — the "artifact
# exists, nobody uses it" trap one level up. See
# docs/triage-agent/credential-threat-model.md §Why This Document Exists.
#
# Triggered on changes to the Phase-2 deferred deliverables named in
# §Phase-2 Gate of that doc. Extending the trigger list is a deliberate
# act: only add paths corresponding to deliverables the threat model
# governs.
# =============================================================================

# =============================================================================
# SCOPE LIMITATION — read this before relying on this gate.
#
# This workflow verifies the credential threat model has a citable
# canonical home with its checklist markers intact. It does NOT verify
# that any code conforms to the convention. Convention conformance is
# enforced by HUMAN REVIEWERS applying the checklist (Q1/Q2/Q3) during
# PR review.
#
# A green check on this workflow means: "the canonical home is present
# and legible." It does NOT mean: "the PR's code is credential-safe." A
# PR that passes this gate but introduces a Q2 violation in source has
# failed convention enforcement; this workflow cannot detect that.
#
# Do not extend this workflow's claims by removing this block. If future
# work adds static analysis for Q1/Q2/Q3 in source, that is a SEPARATE
# workflow with its own honest naming — not an extension of this one.
# This is R3 applied to the gate itself: the gate's safety claim is
# bounded by what it actually verifies.
# =============================================================================

# =============================================================================
# Required-check note (configuration outside this file)
#
# This workflow runs but does not block merges unless added as a REQUIRED
# CHECK in branch protection rules for the target branch
# (Settings → Branches → Branch protection rules → Require status checks
# to pass before merging → search for "verify-threat-model-checklist").
# Without that setting, this workflow is advisory only — a failed check
# can be merged through. The gate's enforcement depends on the
# branch-protection configuration being in place AND on this workflow
# running; either missing turns the gate off.
# =============================================================================

on:
    pull_request:
        paths:
            # Phase-2 deliverables — extend ONLY when adding new Phase-2 surface
            - "scripts/automation/src/triage/dbt_cloud_client.py"
            - "scripts/automation/src/triage/webhook_handler.py"
            - "scripts/automation/src/triage/writer.py"
            # The doc itself — edits must preserve the markers
            - "docs/triage-agent/credential-threat-model.md"
            # The workflow itself — edits must preserve the gate semantics
            - ".github/workflows/credential-threat-model-gate.yaml"

permissions:
    contents: read

jobs:
    verify-threat-model-checklist:
        name: Verify credential threat model doc and checklist markers
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

            - name: Verify doc exists
              run: |
                  if [ ! -f docs/triage-agent/credential-threat-model.md ]; then
                    echo "::error::credential-threat-model.md is missing. Phase-2 deliverables MUST NOT ship without the canonical credential threat model. See docs/triage-agent/credential-threat-model.md §Phase-2 Gate."
                    exit 1
                  fi

            - name: Verify three checklist markers present (Q1, Q2, Q3)
              run: |
                  DOC=docs/triage-agent/credential-threat-model.md
                  MISSING=0
                  for MARKER in '\*\*Q1\.\*\*' '\*\*Q2\.\*\*' '\*\*Q3\.\*\*'; do
                    if ! grep -q "$MARKER" "$DOC"; then
                      echo "::error file=$DOC::Missing checklist marker: $MARKER. The threat-model doc must contain all three checklist questions verbatim (see §Checklist). A stub or marker-less doc fails the gate."
                      MISSING=$((MISSING + 1))
                    fi
                  done
                  if [ "$MISSING" -gt 0 ]; then
                    exit 1
                  fi
                  echo "All three checklist markers present in $DOC."
