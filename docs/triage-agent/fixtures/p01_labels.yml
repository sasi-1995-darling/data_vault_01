# ============================================================================
# P0.1 Labeled Corpus — backtest harness ground truth
# ============================================================================
#
# Version: v1.1.0     (bump on any schema change; document rationale below)
# Generated: 2026-06-07 (v1.0.0); repointed 2026-06-11 (v1.1.0)
# Schema: scripts/automation/src/triage/backtest_schema.py :: LabelSet
#
# Purpose
# -------
# Ground-truth labels for the 7 P0.1 dbt Cloud failure payloads. Consumed by
# the backtest harness (`scripts.automation.src.triage.backtest`) to score
# `triage_failure(raw_payload)` output against expected pattern_id + outcome.
#
# Provenance discipline (per session-prompt H4 refinement, 2026-06-07)
# --------------------------------------------------------------------
# Every entry carries a `provenance` block explaining WHY its expected values
# are what they are. Reviewers can distinguish empirically-grounded labels
# (catalog provenance cites the run_id directly) from category-confirmed
# labels (catalog notes the run_id as a recurring incident but does not
# independently byte-verify it) from no-pattern-applicable labels
# (sprint-1-deferred Cluster C scope).
#
# This sets the Phase-2 precedent: production failures + manufactured cases
# added later MUST carry the same provenance shape. Best-guess labels lacking
# provenance are inadmissible for backtest scoring without a recorded
# rationale.
#
# Schema version log
# ------------------
# v1.0.0 (2026-06-07) — initial schema; 7 P0.1 entries; required fields
#   {run_id, cluster, expected_pattern_id, expected_outcome, payload_source,
#    payload_path, payload_shape, provenance{cluster_source, pattern_source,
#    derivation}, notes}.
# v1.1.0 (2026-06-11) — schema fields unchanged; payload_source flipped
#   from `scratch` → `fixture` for all 7 entries, with payload_path
#   repointed from `~/scratch/triage-day4/run_<id>_cluster_<X>.json` to
#   the committed pipeline-emitted equivalents under
#   `docs/triage-agent/fixtures/`. Activates the fixture branch of
#   resolve_payload_path() (dead code prior to this bump) and the
#   L173-181 traversal-defense is_relative_to check that gates it.
#   Operational test (1) from phase-2-backtest-corpus-gate.md is
#   content-based, not path-based — the gate's in-sample status is
#   preserved across this repoint.
#
# Payload source notes
# --------------------
# As of v1.1.0, all 7 raw payloads are resolved against committed
# fixtures under docs/triage-agent/fixtures/ — clean-clone CI exercises
# the live producer→consumer chain without any scratch dependency. The
# fixtures are pipeline-emitted (redactor_pipeline.py --all) from the
# v1.0.0 raw scratch payloads in ~/scratch/triage-day4/; the chain is
# raw-scratch → redactor_pipeline → committed-fixture → backtest harness.
# The raw scratch directory is retained on operator hosts but is no
# longer on the harness's load path.
# ============================================================================

version: v1.1.0
