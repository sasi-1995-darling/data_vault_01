version: 2
models:
  - name: pit_po_receipt_current
    description: This model consolidates purchase order receipt data (i.e. for Master Lock TRANSACTION_TYPE_ID IN ('18','71'), For SAP BEWTP = 'E') from multiple sources, providing a unified view of receipt transactions. It includes details such as transaction types, dates, quantities, and values, and is used to identify goods receipts based on specific transaction types or conditions.
    data_tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - PO_ITEM_RECEIPT_DK
    columns:
      - name: PROMISED_DATE_LATEST__YYYYMMDD
        description: >
          Supplier's promised delivery date (latest across the PO line's
          schedule lines), as a YYYYMMDD integer. Combines E21
          POITEM.DATE_PROMISED and Oracle EBS / Fusion schedule-line
          PROMISED_DATE (COALESCE per source). Schedule lines are
          Fivetran-sourced, so true deletes are excluded via _FIVETRAN_DELETED
          (deleted within 500 days of the detecting sync) while aged-out or
          archived rows are retained; PSA_DELETE_IND is not used for these
          sources. Attached at PO-line level (aggregated) because receipts
          do not carry the schedule key (LINE_LOCATION_ID); NULL for other
          source systems. Coverage: ~26% of receipts.
      - name: PROMISED_DATE_EARLIEST__YYYYMMDD
        description: >
          Supplier's promised delivery date (earliest across the PO line's
          schedule lines), as a YYYYMMDD integer. Same sourcing and caveats as
          PROMISED_DATE_LATEST__YYYYMMDD (E21 + Oracle EBS / Fusion, Fivetran
          true-deletes excluded via _FIVETRAN_DELETED, PO-line-level aggregate).
          Coverage: ~26% of receipts.
      - name: NEED_BY_DATE_LATEST__YYYYMMDD
        description: >
          MRP-driven in-house need-by date (latest across the PO line's schedule
          lines), as a YYYYMMDD integer. Sourced from Oracle EBS / Fusion
          schedule-line NEED_BY_DATE. Schedule lines are Fivetran-sourced, so
          true deletes are excluded via _FIVETRAN_DELETED (deleted within 500
          days of the detecting sync); PO-line-level aggregate (no
          receipt-to-schedule key); NULL for other source systems. Coverage:
          ~4% of receipts.
      - name: NEED_BY_DATE_EARLIEST__YYYYMMDD
        description: >
          MRP-driven in-house need-by date (earliest across the PO line's
          schedule lines), as a YYYYMMDD integer. Same sourcing and caveats as
          NEED_BY_DATE_LATEST__YYYYMMDD. Coverage: ~4% of receipts.
      - name: ORIGINAL_PROMISED_DATE__YYYYMMDD
        description: >
          Supplier's first committed delivery date before any changes, as a
          YYYYMMDD integer, used for the supplier commit-accuracy metric.
          Sourced from Therma-Tru E21 (POITEM.ORIG_DATE_PROMISED) at PO-item
          grain; NULL for other source systems. Same definition as the
          FACT_PO_ITEM column of the same name. Coverage: ~10% of receipts.