version: 2
models:
- name: hub_cost_element
  tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - COST_ELEMENT_HK
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
      - name: COST_ELEMENT_HK
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: COST_ELEMENT_BK
        tests:
          - not_null:
              config:
                severity: warn
      - name: BKCC
        tests:
          - not_null:
              config:
                severity: warn
      - name: LOAD_DTS
        tests:
          - not_null:
              config:
                severity: warn
      - name: REC_SRC
        tests:
          - not_null:
              config:
                severity: warn

