version: 2
models:
- name: hub_alarm
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - ALARM_HK
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: ALARM_HK
    data_tests:
    - unique:
        config:
          severity: warn
