version: 2
models:
  - name: hub_payment_schedule
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - PAYMENT_SCHEDULE_HK
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: PAYMENT_SCHEDULE_HK
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: PAYMENT_SCHEDULE_BK
        tests:
          - not_null:
              config:
                severity: warn
      - name: BKCC
        tests:
          - not_null:
              config:
                severity: warn
      - name: LOAD_DTS
        tests:
          - not_null:
              config:
                severity: warn
      - name: REC_SRC
        tests:
          - not_null:
              config:
                severity: warn
