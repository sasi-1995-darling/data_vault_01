version: 2
models:
- name: hub_address
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - ADDRESS_HK
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: ADDRESS_HK
    data_tests:
    - unique:
        config:
          severity: warn
    - not_null:
        config:
          severity: warn
  - name: ADDRESS_BK
    data_tests:
    - not_null:
        config:
          severity: warn
