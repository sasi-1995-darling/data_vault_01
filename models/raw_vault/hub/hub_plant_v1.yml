version: 2
models:
- name: hub_plant_v1
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - PLANT_HK
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
      - name: PLANT_BK
        tests:
          - not_null
      - name: BKCC
        tests:
          - not_null
      - name: REC_SRC
        tests:
          - not_null
      - name: LOAD_DTS
        tests:
          - not_null       

