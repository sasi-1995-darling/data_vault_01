version: 2
models:
  - name: hub_legal_entity
    data_tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - LEGAL_ENTITY_HK
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: LEGAL_ENTITY_BK
        tests:
          - not_null
      - name: BKCC
        tests:
          - not_null
      - name: REC_SRC
        tests:
          - not_null