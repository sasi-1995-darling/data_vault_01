version: 2
models:
- name: hub_work_center_location
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - WORK_CENTER_LOCATION_HK
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: WORK_CENTER_LOCATION_HK
    data_tests:
    - unique:
        config:
          severity: warn
    - not_null:
        config:
          severity: warn
  - name: WORK_CENTER_LOCATION_BK
    data_tests:
    - not_null:
        config:
          severity: warn
