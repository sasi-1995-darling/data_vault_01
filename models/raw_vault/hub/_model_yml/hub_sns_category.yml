version: 2
models:
  - name: hub_sns_category
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - SNS_CATEGORY_HK
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: SNS_CATEGORY_HK
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn