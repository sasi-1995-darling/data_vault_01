version: 2
models:
  - name: sat_payment_term__tt_gp
    data_tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - PAYMENT_TERM_HK
              - LOAD_DTS
          config:
            severity: warn
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 4
          config:
            severity: warn
    columns:
      - name: PAYMENT_TERM_HK
        data_tests:
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_payment_term' )
                pk_column_name: PAYMENT_TERM_HK
    config:
      tags:
        - sat
