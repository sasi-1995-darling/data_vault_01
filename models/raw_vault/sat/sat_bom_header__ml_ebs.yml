version: 2
models:
  - name: sat_bom_header__ml_ebs
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - BOM_HK
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: BOM_HK
        tests:
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_bom' )
                pk_column_name: BOM_HK