version: 2
models:
- name: sat_equipment__winn_sap
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - EQUIPMENT_HK
        - LOAD_DTS
      config:
        severity: warn
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: EQUIPMENT_HK
    data_tests:
    - dbt_constraints.foreign_key:
        arguments:
          pk_table_name: ref( 'hub_equipment' )
          pk_column_name: EQUIPMENT_HK
        config:
          severity: warn
  config:
    tags:
      - sat
