version: 2
models:
  - name: sat_customer_party__ml_ebs
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - CUSTOMER_HK
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: CUSTOMER_HK
        tests:
          - not_null:
              config:
                severity: warn
      - name: LOAD_DTS
        tests:
          - not_null:
              config:
                severity: warn
      - name: REC_SRC
        tests:
          - not_null:
              config:
                severity: warn
      - name: HASHDIFF
        tests:
          - not_null:
              config:
                severity: warn