version: 2
models:
- name: sat_user_engagement_track__android_moen
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - CONSUMER_HK
        - HASHDIFF
        - LOAD_DTS
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: CONSUMER_HK
    data_tests:
    - not_null:
        config:
          severity: warn
    - dbt_constraints.foreign_key:
        arguments:
          pk_table_name: ref( 'hub_consumer' )
          pk_column_name: CONSUMER_HK
