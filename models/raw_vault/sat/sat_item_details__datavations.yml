version: 2
models:
  - name: sat_item_details__datavations
    description: >
      Standard satellite storing product item detail attributes from Datavations.
      Grain: one row per COMPETITIVE_PRODUCT_HK + HASHDIFF + LOAD_DTS.
      Tracks changes to descriptive item attributes: ITEM_NAME, ITEM_ID, BRAND, CATEGORY,
      DEPARTMENT, PARENT_CATEGORY, RETAILER, RETAILER_CATEGORY, SECTOR, STORE_ITEM_ID.
    data_tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - COMPETITIVE_PRODUCT_HK
              - HASHDIFF
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 4
          config:
            severity: warn
    columns:
      - name: COMPETITIVE_PRODUCT_HK
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: HASHDIFF
        data_tests:
          - not_null:
              config:
                severity: warn
      - name: LOAD_DTS
        data_tests:
          - not_null:
              config: 
                severity: warn