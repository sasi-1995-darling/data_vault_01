version: 2
models:
  - name: sat_invoice_adjustments__ml_ebs
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - INVOICE_HK
              - ADJUSTMENT_ID
              - LOAD_DTS
    columns:
      - name: INVOICE_HK
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.relationships_where:
              arguments:
                to: ref( 'hub_invoice_header' )
                field: INVOICE_HK
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_invoice_header' )
                pk_column_name: INVOICE_HK
      - name: LOAD_DTS
        tests:
          - not_null:
              config:
                severity: warn
      - name: REC_SRC
        tests:
          - not_null:
              config:
                severity: warn
      - name: HASHDIFF
        tests:
          - not_null:
              config:
                severity: warn