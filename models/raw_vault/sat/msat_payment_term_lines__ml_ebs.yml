version: 2
models:
- name: msat_payment_term_lines__ml_ebs
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - PAYMENT_TERM_HK
        - SEQUENCE_NUM
        - LOAD_DTS
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: PAYMENT_TERM_HK
    data_tests:
    - dbt_constraints.foreign_key:
        arguments:
          pk_table_name: ref( 'hub_payment_term' )
          pk_column_name: PAYMENT_TERM_HK
  - name: TERM_ID
    data_tests:
    - not_null:
        config:
          severity: warn
