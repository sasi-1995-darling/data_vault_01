version: 2
models:
  - name: sat_inventory__amazon
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - REPORT_END_DATE
              - ASIN
              - VENDORCENTRAL_ACCOUNT
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: STORE_HK
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_store' )
                pk_column_name: STORE_HK
      - name: REPORT_END_DATE
        tests:
          - not_null:
              config:
                severity: warn
      - name: ASIN
        tests:
          - not_null:
              config:
                severity: warn
      - name: VENDORCENTRAL_ACCOUNT
        tests:
          - not_null:
              config:
                severity: warn
      - name: LOAD_DTS
        tests:
          - not_null:
              config:
                severity: warn