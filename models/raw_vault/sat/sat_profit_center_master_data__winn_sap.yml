version: 2
models:
  - name: sat_profit_center_master_data__winn_sap
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - OBJECT_NUMBER_HK
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: OBJECT_NUMBER_HK
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.relationships_where:
              arguments:
                to: ref( 'hub_profit_center_master_data' )
                field: OBJECT_NUMBER_HK