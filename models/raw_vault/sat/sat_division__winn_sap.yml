version: 2
models:
  - name: sat_division__winn_sap
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - DIVISION_HK
              - SPRAS
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: DIVISION_HK
        tests:
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_division' )
                pk_column_name: DIVISION_HK