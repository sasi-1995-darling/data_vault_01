version: 2
models:
  - name: sat_po_header__tt_gp
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - PO_HEADER_HK
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: PO_HEADER_HK
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_po_header' )
                pk_column_name: PO_HEADER_HK
      - name: PONUMBER
        tests:
          - not_null:
              config:
                severity: warn
      - name: BKCC
        tests:
          - not_null
      - name: REC_SRC
        tests:
          - not_null
      - name: LOAD_DTS
        tests:
          - not_null