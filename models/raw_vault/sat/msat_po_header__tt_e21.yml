version: 2
models:
  - name: msat_po_header__tt_e21
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - PO_HEADER_HK
              - REL_NUMB
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: PO_HEADER_HK
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_po_header' )
                pk_column_name: PO_HEADER_HK
      - name: PO_NUMBER
        tests:
          - not_null:
              config:
                severity: warn
      - name: REL_NUMB
        tests:
          - not_null:
              config:
                severity: warn