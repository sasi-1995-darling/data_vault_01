version: 2
models:
- name: sat_sales_inventory__larson_lowes_ft_api
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - STORE_HK
        - ITEM_ID
        - START_DATE
        - END_DATE
        - LOAD_DTS
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: STORE_HK
    data_tests:
    - dbt_constraints.foreign_key:
        arguments:
          pk_table_name: ref( 'hub_store' )
          pk_column_name: STORE_HK
