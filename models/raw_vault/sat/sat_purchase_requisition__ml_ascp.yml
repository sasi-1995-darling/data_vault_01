          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: PURCHASE_REQUISITION_HK
        tests:
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_purchase_requisition' )
                pk_column_name: PURCHASE_REQUISITION_HK
      - name: BKCC
        tests:
          - not_null
      - name: REC_SRC
        tests:
          - not_null
      - name: LOAD_DTS
        tests:
          - not_null