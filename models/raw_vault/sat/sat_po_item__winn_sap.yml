version: 2
models:
  - name: sat_po_item__winn_sap
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - PO_ITEM_HK
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: PO_ITEM_HK
        tests:
    # - dbt_utils.relationships_where:
    #     to: ref( 'hub_po_item' )
    #     field: PO_ITEM_HK
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_po_item' )
                pk_column_name: PO_ITEM_HK
      - name: BKCC
        tests:
          - not_null
      - name: REC_SRC
        tests:
          - not_null
      - name: LOAD_DTS
        tests:
          - not_null
