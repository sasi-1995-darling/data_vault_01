version: 2
models:
- name: sat_plant__emtk_ebs
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - PLANT_HK
        - LOAD_DTS
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: PLANT_HK
    data_tests:
    - not_null:
        config:
          severity: warn
    - dbt_constraints.foreign_key:
        arguments:
          pk_table_name: ref( 'hub_plant_v1' )
          pk_column_name: PLANT_HK
  - name: LOAD_DTS
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: REC_SRC
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: BKCC
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: HASHDIFF
    data_tests:
    - not_null:
        config:
          severity: warn
