version: 2
models:
  - name: sat_county__snfl_usps
    tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: warn
          arguments:
            combination_of_columns:
              - USPS
              - GEOID
              - LOAD_DTS
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - USPS
              - GEOID
              - LOAD_DTS
    columns:
      - name: COUNTY_HK
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.relationships_where:
              arguments:
                to: ref( 'hub_county' )
                field: COUNTY_HK
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_county' )
                pk_column_name: COUNTY_HK
      - name: USPS
        tests:
          - not_null:
              config:
                severity: warn
      - name: GEOID
        tests:
          - not_null:
              config:
                severity: warn
      - name: LOAD_DTS
        tests:
          - not_null:
              config:
                severity: warn
      - name: REC_SRC
        tests:
          - not_null:
              config:
                severity: warn
      - name: HASHDIFF
        tests:
          - not_null:
              config:
                severity: warn