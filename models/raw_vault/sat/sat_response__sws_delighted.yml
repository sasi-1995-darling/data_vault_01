version: 2
models:
  - name: sat_response__sws_delighted
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - PRODUCT_HK
              - ID
              - HASHDIFF
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: PRODUCT_HK
        tests:
          - not_null:
              config:
                severity: warn