version: 2
models:
  - name: lsat_profit_center_postings__winn_sap
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - PROFIT_CENTER_POSTINGS_HK
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: PROFIT_CENTER_POSTINGS_HK
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'lnk_profit_center_postings' )
                pk_column_name: PROFIT_CENTER_POSTINGS_HK