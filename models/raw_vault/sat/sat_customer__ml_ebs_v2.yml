version: 2
models:
  - name: sat_customer__ml_ebs_v2
    tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: warn
          arguments:
            combination_of_columns:
              - CUSTOMER_HK
              - LOAD_DTS
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - CUSTOMER_HK
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: CUSTOMER_HK
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_customer_v1' )
                pk_column_name: CUSTOMER_HK
      - name: BKCC
        tests:
          - not_null:
              config:
                severity: warn