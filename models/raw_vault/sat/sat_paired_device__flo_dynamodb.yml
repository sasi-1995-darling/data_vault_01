version: 2
models:
- name: sat_paired_device__flo_dynamodb
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - PAIRED_DEVICE_HK
        - HASHDIFF
        - LOAD_DTS
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: PAIRED_DEVICE_HK
    data_tests:
    - not_null:
        config:
          severity: warn
