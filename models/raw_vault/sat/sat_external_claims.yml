version: 2
models:
  - name: sat_external_claims
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - CLAIM_NUMBER_HK
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: CLAIM_NUMBER_HK
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.relationships_where:
              arguments:
                to: ref( 'hub_external_claims' )
                field: CLAIM_NUMBER_HK