version: 2

models:
  - name: sat_plant__moen_sap
    description: This is the raw vault satellite model for plant data from moen sap source
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - plant_hk
              - load_dts
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - plant_hk
            pk_table_name: ref('hub_plant')
            pk_column_names:
              - plant_hk