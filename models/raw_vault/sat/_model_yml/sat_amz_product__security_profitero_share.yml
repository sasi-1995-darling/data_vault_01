version: 2
models:
  - name: sat_amz_product__security_profitero_share
    data_tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - ASIN_HK
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: ASIN_HK
        data_tests:
          - not_null:
              config:
                severity: warn
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_asin' )
                pk_column_name: ASIN_HK
      - name: ASIN
        data_tests:
          - not_null:
              config:
                severity: warn
