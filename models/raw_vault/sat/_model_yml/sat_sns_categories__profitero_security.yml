version: 2
models:
  - name: sat_sns_categories__profitero_security
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - ID
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: SNS_CATEGORY_HK
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_sns_category' )
                pk_column_name: SNS_CATEGORY_HK
      - name: LOAD_DTS
        tests:
          - not_null:
              config:
                severity: warn
      - name: ID
        tests:
          - not_null:
              config:
                severity: warn