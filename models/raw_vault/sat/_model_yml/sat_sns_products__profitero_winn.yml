version: 2
models:
  - name: sat_sns_products__profitero_winn
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - ASIN
              - LOAD_DTS
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: ASIN_HK
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_asin' )
                pk_column_name: ASIN_HK