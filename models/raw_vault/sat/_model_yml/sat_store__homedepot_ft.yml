version: 2
models:
- name: sat_store__homedepot_ft
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - D_STORE_NBR
        - LOAD_DTS
        - HOME_DEPOT_ACCOUNT
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: STORE_HK
    data_tests:
    - not_null:
        config:
          severity: warn
    - dbt_constraints.foreign_key:
        arguments:
          pk_table_name: ref( 'hub_store' )
          pk_column_name: STORE_HK
  - name: STORE_BK
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: D_STORE_NBR
    data_tests:
    - not_null:
        config:
          severity: warn
