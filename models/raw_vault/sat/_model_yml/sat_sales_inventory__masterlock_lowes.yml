version: 2
models:
  - name: sat_sales_inventory__masterlock_lowes
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - LOCATION_ID
              - ITEM_ID
              - END_DATE
              - LOAD_DTS
    columns:
      - name: STORE_HK
        tests:
          - not_null:
              config:
                severity: warn
          - dbt_utils.relationships_where:
              config:
                severity: warn
              arguments:
                to: ref( 'hub_store' )
                field: STORE_HK
          - dbt_constraints.foreign_key:
              config:
                severity: warn
              arguments:
                pk_table_name: ref( 'hub_store' )
                pk_column_name: STORE_HK
      - name: LOCATION_ID
        tests:
          - not_null:
              config:
                severity: warn
      - name: ITEM_ID
        tests:
          - not_null:
              config:
                severity: warn
      - name: END_DATE
        tests:
          - not_null:
              config:
                severity: warn
      - name: LOAD_DTS
        tests:
          - not_null:
              config:
                severity: warn