version: 2
models:
- name: lnk_order_order_line
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - ORDER_ORDER_LINE_HK
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: ORDER_ORDER_LINE_HK
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: ORDER_HEADER_HK
    data_tests:
    - dbt_constraints.foreign_key:
        arguments:
          pk_table_name: ref( 'hub_order_header' )
          pk_column_name: ORDER_HEADER_HK
  - name: ORDER_LINE_HK
    data_tests:
    - dbt_constraints.foreign_key:
        arguments:
          pk_table_name: ref( 'hub_order_line' )
          pk_column_name: ORDER_LINE_HK