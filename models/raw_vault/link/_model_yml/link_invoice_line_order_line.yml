version: 2
models:
  - name: link_invoice_line_order_line
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - INVOICE_LINE_ORDER_LINE_HK
    columns:
      - name: INVOICE_LINE_ORDER_LINE_HK
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: ORDER_LINE_HK
        tests:
          - dbt_utils.relationships_where:
              arguments:
                to: ref( 'hub_order_line' )
                field: ORDER_LINE_HK
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_order_line' )
                pk_column_name: ORDER_LINE_HK
          - not_null:
              config:
                severity: warn
      - name: INVOICE_LINE_HK
        tests:
          - dbt_utils.relationships_where:
              arguments:
                to: ref( 'hub_invoice_line_v1' )
                field: INVOICE_LINE_HK
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_invoice_line_v1' )
                pk_column_name: INVOICE_LINE_HK
          - not_null:
              config:
                severity: warn
      - name: LOAD_DTS
        tests:
          - not_null:
              config:
                severity: warn
      - name: REC_SRC
        tests:
          - not_null:
              config:
                severity: warn