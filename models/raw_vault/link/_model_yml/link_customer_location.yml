version: 2

models:
  - name: link_customer_location
    description: This is the raw vault link model for Larson between customer and location
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - customer_location_hk
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - customer_hk
            pk_table_name: ref('hub_customer')
            pk_column_names:
              - customer_hk
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - location_hk
            pk_table_name: ref('hub_locations')
            pk_column_names:
              - location_hk