version: 2

models:
  - name: link_invoice_adj_invoice_line
    description: This is the raw vault link model between invoice line and invoice adjustment
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - invoice_adj_invoice_line_hk
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - invoice_line_hk
            pk_table_name: ref('hub_invoice_line')
            pk_column_names:
              - invoice_line_hk
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - invoice_adjustment_hk
            pk_table_name: ref('hub_invoice_adjustment')
            pk_column_names:
              - invoice_adjustment_hk
    config:
      tags:
        - emtek