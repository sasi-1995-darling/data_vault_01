version: 2

models:
  - name: link_po_supplier
    description: This is the raw vault link model between purchase order, supplier, and supplier site
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - po_supplier_link_hk
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - purchase_order_hk
            pk_table_name: ref('hub_purchase_order')
            pk_column_names:
              - purchase_order_hk
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - supplier_hk
            pk_table_name: ref('hub_supplier')
            pk_column_names:
              - supplier_hk
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - supplier_site_hk
            pk_table_name: ref('hub_supplier_site')
            pk_column_names:
              - supplier_site_hk
    config:
      tags:
        - emtek