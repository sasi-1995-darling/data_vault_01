version: 2

models:
  - name: link_po_line_shipment
    description: This is the raw vault link model between po line and po line shipment
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - po_line_shipment_link_hk
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - po_line_shipment_hk
            pk_table_name: ref('hub_po_line_shipment')
            pk_column_names:
              - po_line_shipment_hk
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - po_line_hk
            pk_table_name: ref('hub_po_line')
            pk_column_names:
              - po_line_hk
    config:
      tags:
        - emtek