version: 2

models:
  - name: link_invoice_adjustment_customer
    description: This is the 3-way raw vault link model between invoice adjustment, customer and customer bill location
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - invoice_adjustment_customer_hk
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - customer_hk
            pk_table_name: ref('hub_customer')
            pk_column_names:
              - customer_hk
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - customer_bill_location_hk
            pk_table_name: ref('hub_customer_bill_location')
            pk_column_names:
              - customer_bill_location_hk
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - invoice_adjustment_hk
            pk_table_name: ref('hub_invoice_adjustment')
            pk_column_names:
              - invoice_adjustment_hk
    config:
      tags:
        - emtek