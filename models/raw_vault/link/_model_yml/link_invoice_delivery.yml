version: 2

models:
  - name: link_invoice_delivery
    description: This is the raw vault link model between invoice and delivery
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - invoice_delivery_hk
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - invoice_hk
            pk_table_name: ref('hub_invoice')
            pk_column_names:
              - invoice_hk
      - dbt_constraints.foreign_key:
          arguments:
            fk_column_names:
              - delivery_hk
            pk_table_name: ref('hub_delivery')
            pk_column_names:
              - delivery_hk
    config:
      tags:
        - emtek