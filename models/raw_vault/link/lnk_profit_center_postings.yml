version: 2
models:
  - name: lnk_profit_center_postings
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - PROFIT_CENTER_POSTINGS_HK
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: LEDGER_HK
        tests:
          - dbt_utils.relationships_where:
              arguments:
                to: ref( 'hub_ledger' )
                field: LEDGER_HK
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_ledger' )
                pk_column_name: LEDGER_HK