version: 2
models:
- name: lnk_icd_device
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - ICD_DEVICE_HK
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: ICD_DEVICE_HK
    data_tests:
    - not_null:
        config:
          severity: warn
