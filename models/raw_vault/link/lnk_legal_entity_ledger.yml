version: 2
models:
- name: lnk_legal_entity_ledger
  data_tests:
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: LEDGER_HK
    tests:
    - dbt_utils.relationships_where:
        arguments:
          to: ref( 'hub_ledger' )
          field: LEDGER_HK
  - name: LEGAL_ENTITY_HK
    tests:
    - dbt_utils.relationships_where:
        arguments:
          to: ref( 'hub_legal_entity' )
          field: LEGAL_ENTITY_HK