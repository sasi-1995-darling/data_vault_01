version: 2
models:
- name: lnk_account_base_material_promotion
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - LNK_ACCOUNT_BASE_MATERIAL_PROMOTION_HK
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: KEY_ACCOUNT_GROUP_HK
    data_tests:
    - dbt_constraints.foreign_key:
        arguments:
          pk_table_name: ref( 'hub_key_account_group' )
          pk_column_name: KEY_ACCOUNT_GROUP_HK
  - name: BASE_MATERIAL_HK
    data_tests:
    - dbt_constraints.foreign_key:
        arguments:
          pk_table_name: ref( 'hub_base_material' )
          pk_column_name: BASE_MATERIAL_HK
  - name: PROMOTION_HK
    data_tests:
    - dbt_constraints.foreign_key:
        arguments:
          pk_table_name: ref( 'hub_promotion' )
          pk_column_name: PROMOTION_HK
