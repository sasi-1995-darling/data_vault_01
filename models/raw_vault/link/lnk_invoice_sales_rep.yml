version: 2
models:
  - name: lnk_invoice_sales_rep
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - INVOICE_SALES_REP_HK
    columns:
      - name: INVOICE_SALES_REP_HK
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: INVOICE_HK
        tests:
          - dbt_utils.relationships_where:
              arguments:
                to: ref( 'hub_invoice_header' )
                field: INVOICE_HK
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_invoice_header' )
                pk_column_name: INVOICE_HK
      - name: SALES_REP_HK
        tests:
          - dbt_utils.relationships_where:
              arguments:
                to: ref( 'hub_sales_rep' )
                field: SALES_REP_HK
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_sales_rep' )
                pk_column_name: SALES_REP_HK