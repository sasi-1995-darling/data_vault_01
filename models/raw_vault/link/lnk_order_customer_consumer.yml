version: 2
models:
- name: lnk_order_customer_consumer
  data_tests:
  - dbt_constraints.primary_key:
      arguments:
        column_names:
        - LNK_ORDER_CUSTOMER_CONSUMER_HK
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
  - name: LNK_ORDER_CUSTOMER_CONSUMER_HK
    data_tests:
    - not_null:
        config:
          severity: warn
  - name: ORDER_HEADER_HK
    data_tests:
    - dbt_constraints.foreign_key:
        arguments:
          pk_table_name: ref( 'hub_order_header' )
          pk_column_name: ORDER_HEADER_HK
  - name: CUSTOMER_HK
    data_tests:
    - dbt_constraints.foreign_key:
        arguments:
          pk_table_name: ref( 'hub_customer_v1' )
          pk_column_name: CUSTOMER_HK
  - name: CONSUMER_HK
    data_tests:
    - dbt_constraints.foreign_key:
        arguments:
          pk_table_name: ref( 'hub_consumer' )
          pk_column_name: CONSUMER_HK
