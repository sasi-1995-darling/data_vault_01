      arguments:
        column_names:
        - PLANT_ITEM_HK
  - dbt_expectations.expect_table_row_count_to_be_between:
      arguments:
        min_value: 4
      config:
        severity: warn
  columns:
      - name: PLANT_ITEM_HK
        tests:
          - not_null
      - name: ITEM_HK
        tests:
          - not_null
      - name: LOAD_DTS
        tests:
          - not_null
      - name: REC_SRC
        tests:
          - not_null       