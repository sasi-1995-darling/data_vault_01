version: 2
models:
  - name: lnk_bom_item
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - LNK_BOM_ITEM_HK
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: LNK_BOM_ITEM_HK
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: BOM_HK
        tests:
          - dbt_utils.relationships_where:
              arguments:
                to: ref( 'hub_bom' )
                field: BOM_HK
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_bom' )
                pk_column_name: BOM_HK
      - name: ITEM_HK
        tests:
          - dbt_utils.relationships_where:
              arguments:
                to: ref( 'hub_item_v1' )
                field: ITEM_HK
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_item_v1' )
                pk_column_name: ITEM_HK