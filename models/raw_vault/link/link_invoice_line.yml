version: 2
models:
  - name: link_invoice_line
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - INVOICE_INVOICE_LINE_HK
      - dbt_expectations.expect_table_row_count_to_be_between:
          arguments:
            min_value: 4
    columns:
      - name: INVOICE_INVOICE_LINE_HK
        tests:
          - unique:
              config:
                severity: warn
          - not_null:
              config:
                severity: warn
      - name: INVOICE_LINE_HK
        tests:
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_invoice_line_v1' )
                pk_column_name: INVOICE_LINE_HK
          - not_null:
              config:
                severity: warn
      - name: INVOICE_HK
        tests:
          - dbt_constraints.foreign_key:
              arguments:
                pk_table_name: ref( 'hub_invoice_header' )
                pk_column_name: INVOICE_HK
          - not_null:
              config:
                severity: warn
      - name: ITEM_HK
        tests:
          - not_null:
              config:
                severity: warn
      - name: LOAD_DTS
        tests:
          - not_null:
              config:
                severity: warn
      - name: REC_SRC
        tests:
          - not_null:
              config:
                severity: warn