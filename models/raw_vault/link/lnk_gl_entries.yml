version: 2
models:
  - name: lnk_gl_entries
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - GL_ENTRIES_HEADER_ACCOUNT_HK
      - dbt_expectations.expect_table_row_count_to_be_between:
          config:
            severity: warn
          arguments:
            min_value: 4
    columns:
      - name: GL_ENTRIES_HEADER_ACCOUNT_HK
        tests:
          - not_null:
              config:
                severity: warn