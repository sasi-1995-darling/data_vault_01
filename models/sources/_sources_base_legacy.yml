- name: lowes_vpp_psa
  database: "psa_{{env_var('DBT_SOURCE_ENV')}}"
  description: psa lowes api data
  schema: lowes_vpp
  tables:
    - name: sales_inventory_moen
      description: "POS Sales Data from Lowes API for Moen"
    - name: sales_inventory_larson
      description: "POS Sales Data from Lowes API for Larson"
    - name: sales_inventory_thermatru
      description: "POS Sales Data from Lowes API for Thermatru"
    - name: sales_inventory_masterlock
      description: "POS Sales Data from Lowes API for Masterlock"
    - name: sales_inventory
      description: "POS Sales Historical Data from Lowes API for Moen"

- name: home_depot_psa
  database: "psa_{{env_var('DBT_SOURCE_ENV')}}"
  description: psa home depot data
  schema: home_depot
  tables:
    - name: hd_askuity_pos
      description: "POS Sales Data from Home Depot"
    - name: hd_askuity_master_storeattributes
      description: "POS Store Location Data from Home Depot"

- name: stock_market_psa
  database: "psa_{{env_var('DBT_SOURCE_ENV')}}"
  description: psa stock market data
  schema: stock_market
  tables:
    - name: tsm_lowes_us
      description: "POS Stock Market for Moen"
- name: lowes_us_psa
  database: "psa_{{env_var('DBT_SOURCE_ENV')}}"
  description: psa lowes us misc data
  schema: lowes_us
  tables:
    - name: location
      description: "POS Location Data from Lowes"

- name: us_zip_code_crosswalk_hudusps
  database: "psa_{{env_var('DBT_SOURCE_ENV')}}"
  description: Persistent Staging Area HUD USPS Zipcode Crosswalk Data
  schema: zipcode_crosswalk
  tables:
    - name: cbsa
      description: "cbsa data from HUD USPS Zipcode Crosswalk"
    - name: cbsa_zip
      description: "cbsa zip data from HUD USPS Zipcode Crosswalk"
    - name: county
      description: "county data from HUD USPS Zipcode Crosswalk"
    - name: county_zip
      description: "county zip data from HUD USPS Zipcode Crosswalk"
    - name: tract_zip
      description: "tract zip data from HUD USPS Zipcode Crosswalk"
    - name: zip_cbsa
      description: "zip cbsa data from HUD USPS Zipcode Crosswalk"
    - name: zip_county
      description: "zip county data from HUD USPS Zipcode Crosswalk"
    - name: zip_tract
      description: "zip tract data from HUD USPS Zipcode Crosswalk"

- name: amazon_vc_psa
  database: "psa_{{env_var('DBT_SOURCE_ENV')}}"
  description: amazon vendor central data psa
  schema: amazon_vc
  tables:
    - name: sales
      description: "POS Sales Data for Lowes"   

