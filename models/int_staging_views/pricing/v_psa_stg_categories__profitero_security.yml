          config:
            severity: warn
          arguments:
            combination_of_columns:
              - CATEGORY_ID
              - CUSTOMER_PRODUCT_ID
              - LOAD_DTS
    columns:
      - name: CATEGORY_BK
        tests:
          - not_null:
              config:
                severity: warn
      - name: PRODUCT_BK
        tests:
          - not_null:
              config:
                severity: warn
      - name: LOAD_DTS
        tests:
          - not_null:
              config:
                severity: warn