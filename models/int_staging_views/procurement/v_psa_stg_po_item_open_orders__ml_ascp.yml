version: 2
models:
  - name: v_psa_stg_po_item_open_orders__ml_ascp
    tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: warn
          arguments:
            combination_of_columns:
              - PO_LINE_ID
              - TRANSACTION_ID
              - CREATION_DATE
              - LOAD_DTS
    columns:
      - name: PO_HEADER_ID
        tests:
          - not_null:
              config:
                severity: warn
      - name: LINE_NUM
        tests:
          - not_null:
              config:
                severity: warn