version: 2
models:
  - name: v_psa_stg_quality_messages
    tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: warn
          arguments:
            combination_of_columns:
              - MANDT
              - QMNUM
              - LOAD_DTS
    columns:
      - name: QUALITY_EXCEPT_BK
        tests:
          - not_null:
              config:
                severity: warn
      - name: MANDT
        tests:
          - not_null:
              config:
                severity: warn
      - name: QMNUM
        tests:
          - not_null:
              config:
                severity: warn
      - name: QUALITY_EXCEPT_HK
        tests:
          - not_null:
              config:
                severity: warn