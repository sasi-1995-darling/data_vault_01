version: 2
models:
  - name: v_psa_stg_quality_causes
    tests:
      - dbt_utils.unique_combination_of_columns:
          config:
            severity: warn
          arguments:
            combination_of_columns:
              - QMNUM
              - FENUM
              - URNUM
              - LOAD_DTS
    columns:
      - name: QUALITY_CAUSES_BK
        tests:
          - not_null:
              config:
                severity: warn
      - name: QMNUM
        tests:
          - not_null:
              config:
                severity: warn
      - name: FENUM
        tests:
          - not_null:
              config:
                severity: warn
      - name: URNUM
        tests:
          - not_null:
              config:
                severity: warn