  - name: stg_bi_hdr__lrsn_psft
    description: This is the staging model from Larson for sat_bi_hdr
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - invoice
    columns:
      - name: business_unit
        tests:
          - not_null
  - name: stg_bi_line__lrsn_psft
    description: This is the staging model from Larson for lsat_bi_line
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - invoice
              - line_seq_num
              - product_id
    columns:
      - name: business_unit
        tests:
          - not_null
  - name: stg_rep_cust__lrsn_psft
