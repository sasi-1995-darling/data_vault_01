version: 2

models:
  - name: stg_master_item__lrsn_psft
    description: This is the staging model from Larson for sat_master_item
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - inv_item_id
              - setid
    columns:
      - name: descr
        tests:
          - not_null
  - name: stg_inv_items__lrsn_psft
    description: This is the staging model from Larson for inv_items multi active satellite
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - inv_item_id
              - effdt
    columns:
      - name: setid
        tests:
          - not_null
  - name: stg_prod_item__lrsn_psft
    description: This is the staging model from Larson for sat_prod_item
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - product_id
    columns:
      - name: setid
        tests:
          - not_null
  - name: stg_prod_grp__lrsn_psft
    description: This is the staging model from Larson for sat_prod_grp
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - product_id
    columns:
      - name: setid
        tests:
          - not_null
  - name: stg_sp_prod__lrsn_psft
    description: This is the staging model from Larson for sat_sp_prod
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - product_id
    columns:
      - name: setid
        tests:
          - not_null
