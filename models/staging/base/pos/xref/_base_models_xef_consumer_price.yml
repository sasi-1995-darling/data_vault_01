version: 2

models:
  - name: base_xref_consumer_price
    description: This is base model for average daily consumer price for all brands customerwise.
    tests:
      - 'dbt_constraints.primary_key:':
          arguments:
            column_names:
              - day
              - brand
              - customer
              - base_material
              - rec_src
    columns:
      - name: day
        tests:
          - not_null
      - name: brand
        tests:
          - not_null
      - name: customer
        tests:
          - not_null
      - name: base_material
        tests:
          - not_null
      - name: rec_src
        tests:
          - not_null
      - name: price
        tests:
          - not_null