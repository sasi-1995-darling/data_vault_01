    description: This is the base staging model from Emtek for sat_item_cost
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - org_id
              - segment1

  - name: base_oracle_lookup_values__emtk_ebs_common
    description: This is the base staging model from Emtek for sat_item_cost
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - lookup_type
              - lookup_code
              - view_application_id
              - meaning