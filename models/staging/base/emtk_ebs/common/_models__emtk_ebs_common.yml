version: 2

models:
  - name: base_contact__emtk_ebs_common
    description: This is the base staging model from Emtek for hub_contact
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - contact_point_id

  - name: base_item_base__emtk_ebs_common
    description: This is the base staging model from Emtek for hub_item and sat_item_base
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - org_id
              - segment1

  - name: base_item_language__emtk_ebs_common
    description: This is the base staging model from Emtek for sat_item_language
    tests:
      - dbt_constraints.primary_key:
          arguments:
            column_names:
              - org_id
              - segment1

  - name: base_item_category_map__emtk_ebs_common
